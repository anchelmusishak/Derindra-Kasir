<style>

</style></head><body>
<header><h1>🎱 Kasir Bilyar <small style="opacity:.65;font-size:11px">v9</small></h1><div><button onclick="openRes()">Reservasi</button><button onclick="openRep()">Laporan</button><button onclick="openSet()">Pengaturan</button></div></header>
<div id="grid"></div><div id="al"></div><div id="ts"></div>
<div class="ov" id="ov" onclick="if(event.target==this)closeM()"><div class="sh" id="sh"></div></div>
<div class="ov" id="ov2" style="z-index:15"><div class="sh" id="sh2" style="max-width:360px"></div></div>
<script>
const K='kasirBilyarV1',$=id=>document.getElementById(id),OPEN=new Set();
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const p2=n=>String(n).padStart(2,'0');
const dstr=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const tstr=ms=>{const d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes())};
const hm=ms=>new Date(ms).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const dtl=ms=>(dstr(ms)==dstr(Date.now())?'':new Date(ms).toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' ')+hm(ms);
const fmt=ms=>{const n=ms<0,s=Math.floor(Math.abs(ms)/1000);return(n?'-':'')+[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(p2).join(':')};
const fmtD=m=>{const h=Math.floor(m/60),x=Math.round(m%60);return(h?h+' jam':'')+(h&&x?' ':'')+(x?x+' menit':'')||'0 menit'};
const MSG='Tidak ada tarif yang berlaku untuk sebagian waktu sewa. Aktifkan tarif sewa tetap atau atur jam promo di Pengaturan.';
const FOREST=[['Bubuk Minuman Forest: Cappuccino',23000],['Bubuk Minuman Forest: Vanilla Coffee',25000],['Bubuk Minuman Forest: Caramel Coffee',25000],['Bubuk Minuman Forest: Hazelnut Coffee',25000],['Bubuk Minuman Forest: Chocolate',24000],['Bubuk Minuman Forest: Royal Chocolate',28500],['Bubuk Minuman Forest: Taro',22500],['Bubuk Minuman Forest: Strawberry',24500],['Bubuk Minuman Forest: Avocado',25000],['Bubuk Minuman Forest: Red Velvet',23500],['Bubuk Minuman Forest: Matcha Green Tea',23000],['Bubuk Minuman Forest: Lemon Tea',23000]].map(x=>({n:x[0],p:x[1],c:'min'}));
const OLDM='Air Mineral,Es Teh,Kopi,Kopi Susu,Mie Instan,Nasi Goreng,Kentang Goreng,Rokok';
const def=()=>({tables:[1,2,3,4,5,6].map(i=>({id:i,name:'Meja '+i})),menu:FOREST.map(m=>({...m})),cfg:{},hist:[],res:[]});
const CFG={rate:40000,fixOn:true,rnd:true,taxS:10,taxF:10,taxSOn:true,taxFOn:true,pph:.5,pphOn:true,remOn:true,remMin:10,endOn:true,sndOn:true,vibOn:true,vol:80,wake:true,pin:'',orient:'auto',biz:'Kasir Bilyar',bizNote:''};
let S;try{S=JSON.parse(localStorage.getItem(K))||def()}catch(e){S=def()}
{const c0=S.cfg||{};S.cfg=Object.assign({},CFG,c0);S.cfg.promos=c0.promos||[];S.cfg.disc=c0.disc||[];S.hist=S.hist||[];S.res=(S.res||[]).filter(r=>r.ts>Date.now()-864e5);S.menu=S.menu||[];
 S.tables.forEach(t=>{if(t.mins===undefined){t.mins=Math.round((t.hrs||0)*60);delete t.hrs}Object.assign(t,{on:!!t.on,start:t.start||0,cust:t.cust||'',phone:t.phone||'',orders:t.orders||[],stage:t.stage||[]})});
 S.menu.forEach(m=>{if(!m.c)m.c=/teh|kopi|air|es |jus|susu|minum|soda/i.test(m.n)?'min':/mie|nasi|goreng|roti|snack|ayam|makan|kentang/i.test(m.n)?'mak':'lain'});
 S.cfg.promos.forEach(p=>{if(p.harga===undefined){p.harga=+p.tarif||0;p.dur=1}});
 S.hist.forEach(h=>{if(h.ts<1e12&&h.start)h.ts=h.start+(h.mins!=null?h.mins:(h.hrs||0)*60)*60000});if(S.cfg.menuV!=5){if(S.menu.map(m=>m.n).join()==OLDM)S.menu=FOREST.map(m=>({...m}));S.cfg.menuV=5}S.cfg.ver=5}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Gagal menyimpan data')}};
let cur=null,PRE=null,RES=null,PINCB=null,built=false,AL=[],AC=null,lastBeep=0,lastWake=0,WL=null;
const T=()=>S.tables.find(x=>x.id==cur),hmins=h=>h.mins!=null?h.mins:(h.hrs||0)*60;
const rem=t=>t.start+t.mins*60000-Date.now(),fnb=t=>t.orders.reduce((a,o)=>a+o.p*o.q,0);
/* ===== Perhitungan sewa: tiap menit dihitung menurut sesi waktunya (promo / normal) ===== */
const toM=v=>{if(!v)return null;const a=v.split(':').map(Number);return a[0]*60+a[1]};
const inW=(p,m)=>{const a=toM(p.dari),b=toM(p.sampai);if(a==null||b==null||a==b)return true;return a<b?(m>=a&&m<b):(m>=a||m<b)};
const pr=p=>(+p.dur>0?+p.harga/+p.dur:+p.harga)||0;
function rateAt(ts,H){const c=S.cfg,d=new Date(ts),m=d.getHours()*60+d.getMinutes();let b=c.fixOn?{rate:+c.rate,n:''}:null;
 for(const p of c.promos)if(p.on&&H>=(+p.min||0)&&inW(p,m)&&(!b||pr(p)<b.rate))b={rate:pr(p),n:p.n};return b}
function sewaCalc(start,mins){const H=mins/60,g=[];let raw=0,miss=0,last=null;
 for(let i=0;i<mins;i++){const ts=start+i*60000,b=rateAt(ts,H);if(!b){miss++;last=null;continue}raw+=b.rate/60;
  if(last&&last.n==b.n&&last.rate==b.rate){last.m++;last.to=ts+60000}else{last={n:b.n,rate:b.rate,m:1,from:ts,to:ts+60000};g.push(last)}}
 return{g,raw,miss}}
function discOf(t){let b={pct:0,n:'',scope:'all'};const d=dstr(t.start);
 for(const x of S.cfg.disc){if(!x.on||!x.from||!x.to||d<x.from||d>x.to)continue;const q=+x.pct||0;if(q>b.pct)b={pct:q,n:x.n,scope:x.scope||'all'}}return b}
const calc=t=>{const w=sewaCalc(t.start,t.mins),d=discOf(t),c=S.cfg,f=fnb(t),tS=c.taxSOn?+c.taxS:0,tF=c.taxFOn?+c.taxF:0,
 r=Math.round(w.raw),s=c.rnd?Math.round(r/1000)*1000:r,
 ds=d.scope=='fnb'?0:Math.round(s*d.pct/100),df=d.scope=='sewa'?0:Math.round(f*d.pct/100),
 pS=Math.round((s-ds)*tS/100),pF=Math.round((f-df)*tF/100);
 return{s,f,ds,df,pS,pF,lines:w.g,raw:w.raw,miss:w.miss,dn:d.n,dp:d.pct,sub:s+f-ds-df,tax:pS+pF,tot:s+f-ds-df+pS+pF}};
function segHTML(w){const r=Math.round(w.raw),s=S.cfg.rnd?Math.round(r/1000)*1000:r;
 return'<div class="sum">'+(w.g||w.lines).map(x=>`<div><span>${esc(x.n||'Tarif normal')}<br><span class="sm">${hm(x.from)}–${hm(x.to)} · ${fmtD(x.m)} × ${rp(x.rate)}/jam</span></span><span>${rp(x.m*x.rate/60)}</span></div>`).join('')
 +(w.miss?`<div style="color:#dc2626"><span>⚠ ${fmtD(w.miss)} tanpa tarif berlaku</span><span></span></div>`:'')
 +(s!=r?`<div><span>Pembulatan</span><span>${s>r?'+':'−'}${rp(Math.abs(s-r))}</span></div>`:'')
 +`<div class="g"><span>Total sewa</span><span>${rp(s)}</span></div></div>`}
/* ===== Kartu meja ===== */
const nextRes=id=>S.res.filter(r=>r.table==id&&r.ts>Date.now()-36e5).sort((a,b)=>a.ts-b.ts)[0];
function build(){$('grid').innerHTML=S.tables.map(t=>`<div class="t" id="c${t.id}" onclick="openT(${t.id})"><b></b><div class="cu"></div><div class="st"></div><div class="tm"></div><div class="rp"></div></div>`).join('');built=true;render()}
function render(){if(!built)return build();const ph=Math.floor(Date.now()/1000)%2;
 S.tables.forEach(t=>{const e=$('c'+t.id);if(!e)return;const r=t.on?rem(t):0,red=t.on&&r<=60000,ov=t.on&&r<=0,rv=!t.on&&nextRes(t.id),ch=e.children;
  e.className='t'+(t.on?' on':'')+(rv?' rv':'')+(red?(ph?' r1':' r2'):'');
  ch[0].textContent=t.name;ch[1].textContent=t.on?(t.cust||'—'):'';
  ch[2].textContent=t.on?'Mulai '+hm(t.start)+' · Selesai '+hm(t.start+t.mins*60000):(rv?'📅 '+dtl(rv.ts)+' · '+rv.name:'Kosong');
  ch[3].textContent=t.on?(ov?'⏰ ':'')+fmt(r):'—';ch[4].textContent=t.on?rp(calc(t).tot):''})}
/* ===== Alarm & pengingat ===== */
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function beep(force){const c=S.cfg;
 if((force||c.sndOn)&&AC&&AC.state=='running'){const v=(c.vol||80)/100;for(let i=0;i<3;i++){const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+i*.35;o.type='square';o.frequency.value=i==2?1100:880;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.002,v*.6),t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.28);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.3)}}
 if((force||c.vibOn)&&navigator.vibrate)try{navigator.vibrate([300,120,300,120,300])}catch(e){}}
function notif(txt){try{if(window.Notification&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification('Kasir Bilyar',{body:txt,tag:'kb-'+txt,renotify:true,vibrate:[300,120,300]}))}catch(e){}}
function raise(t,type,r){AL=AL.filter(a=>!(a.id==t.id&&(a.type==type||type=='end')));
 AL.push({id:t.id,type,name:t.name,msg:type=='end'?'WAKTU HABIS':'sisa '+Math.max(1,Math.round(r/60000))+' menit',until:Date.now()+60000,snd:true});
 renderAL();beep();lastBeep=Date.now();notif(t.name+': '+AL[AL.length-1].msg)}
function renderAL(){$('al').innerHTML=AL.map((a,i)=>`<div class="al ${a.type}"><span>${a.type=='end'?'⛔':'⏰'} ${esc(a.name)}: ${a.msg}</span><button onclick="dis(${i})">Matikan</button></div>`).join('')}
function dis(i){AL.splice(i,1);renderAL()}
async function wake(){try{if(!S.cfg.wake||WL||!('wakeLock' in navigator)||document.hidden||!S.tables.some(t=>t.on))return;WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}catch(e){WL=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
function tick(){const now=Date.now(),th=S.cfg.remMin*60000;let ch=false;
 S.tables.forEach(t=>{if(!t.on)return;const r=rem(t);
  if(r>th&&t.f10){t.f10=false;ch=true}if(r>0&&t.f0){t.f0=false;ch=true}
  if(S.cfg.remOn&&!t.f10&&r<=th&&r>0&&t.mins>S.cfg.remMin){t.f10=true;ch=true;raise(t,'rem',r)}
  if(!t.f0&&r<=0){t.f0=true;ch=true;if(S.cfg.endOn)raise(t,'end',r)}});
 const n=AL.length;AL=AL.filter(a=>{const t=S.tables.find(x=>x.id==a.id);return t&&t.on&&(a.type=='rem'?t.f10:t.f0)});if(AL.length!=n)renderAL();
 AL.forEach(a=>{if(a.snd&&now>a.until)a.snd=false});
 if(AL.some(a=>a.snd)&&now-lastBeep>=2500){beep();lastBeep=now}
 if(ch)save();render();
 const e=$('rem');if(e&&cur){const t=T();if(t&&t.on){const r=rem(t);e.textContent=fmt(r);e.style.color=r<=60000?'#dc2626':''}}
 if(now-lastWake>10000){lastWake=now;wake()}}
setInterval(tick,500);
/* ===== Modal ===== */
let TS=0;function toast(m,ms){const e=$('ts');e.textContent=m;e.style.display='block';clearTimeout(TS);TS=setTimeout(()=>{e.style.display='none'},ms||3500)}
const tg=(id,o)=>{o?OPEN.add(id):OPEN.delete(id)};
const dt=(id,title,body)=>`<details ${OPEN.has(id)?'open':''} ontoggle="tg('${id}',this.open)"><summary>${title}</summary><div class="in">${body}</div></details>`;
function show(h){$('sh').innerHTML=h;$('ov').classList.add('show')}
function closeM(){$('ov').classList.remove('show');cur=null;PRE=null;RES=null;render()}
function ask(msg,cb){if(!S.cfg.pin){if(confirm(msg))cb();return}
 $('sh2').innerHTML=`<h2>Kode konfirmasi</h2><div class="sm">${esc(msg)}</div><input id="pn" type="password" inputmode="numeric" placeholder="Masukkan kode" autocomplete="off"><div class="sm" id="pe2" style="color:#dc2626;min-height:16px"></div><div class="row"><button onclick="$('ov2').classList.remove('show')">Batal</button><button class="p" onclick="pinOk()">OK</button></div>`;PINCB=cb;$('ov2').classList.add('show')}
function pinOk(){if($('pn').value===S.cfg.pin){$('ov2').classList.remove('show');PINCB()}else{$('pe2').textContent='Kode salah';$('pn').value=''}}
function custs(){const m={};[...S.hist,...S.res].forEach(h=>{const n=(h.cust||h.name||'').trim(),k=n.toLowerCase();if(n)m[k]={name:n,phone:h.phone||(m[k]||{}).phone||''}});return Object.values(m)}
function fillPh(a,b){const n=$(a).value.trim().toLowerCase(),c=custs().find(x=>x.name.toLowerCase()==n);if(c&&c.phone&&!$(b).value)$(b).value=c.phone}
const dl=()=>`<datalist id="dl">${custs().map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`;
function openT(id){cur=id;drawT()}
function formStart(t,pre){pre=pre||{};const n=Date.now();
 show(`<h2>${esc(t.name)} — Mulai Main</h2>
 <label>Nama pelanggan</label><input id="cu" list="dl" value="${esc(pre.name)}" placeholder="mis. Budi" onchange="fillPh('cu','ph')">${dl()}
 <label>No HP</label><input id="ph" type="tel" inputmode="tel" value="${esc(pre.phone)}" placeholder="08xxxxxxxxxx">
 <div class="row"><div><label>Tanggal</label><input id="jd" type="date" value="${dstr(n)}" oninput="prevS()"></div><div><label>Jam mulai</label><input id="jm" type="time" value="${tstr(n)}" oninput="prevS()"></div><button class="n" onclick="nowT()">Sekarang</button></div>
 <div class="row"><div><label>Durasi sewa (jam, boleh 0,5)</label><input id="du" type="number" min="0.5" max="24" step="0.5" value="${pre.hrs||1}" oninput="prevS()"></div></div>
 <h3>Simulasi biaya sewa</h3><div id="pv"></div>
 <div class="row"><button onclick="closeM()">Batal</button><button onclick="resForm(${t.id})">Reservasi</button><button class="p" onclick="startT()">Mulai</button></div>`);prevS()}
function nowT(){const n=Date.now();$('jd').value=dstr(n);$('jm').value=tstr(n);prevS()}
const readS=()=>({st:new Date($('jd').value+'T'+$('jm').value).getTime(),hr:parseFloat(String($('du').value).replace(',','.'))});
function prevS(){const e=$('pv');if(!e)return;const{st,hr}=readS();if(!st||!(hr>0)){e.textContent='';return}
 const mins=Math.round(hr*60);e.innerHTML=`<div class="sm" style="margin-bottom:4px">${hm(st)} – ${hm(st+mins*60000)} (${fmtD(mins)})</div>`+segHTML(sewaCalc(st,mins))}
function startT(){const t=T(),{st,hr}=readS();if(!st||!(hr>=0.5&&hr<=24))return alert('Isi tanggal, jam mulai, dan durasi (0,5–24 jam) dengan benar');
 const mins=Math.round(hr*60);if(sewaCalc(st,mins).miss)return alert(MSG);
 Object.assign(t,{on:true,start:st,mins,cust:$('cu').value.trim(),phone:$('ph').value.trim(),orders:[],stage:[],f10:false,f0:false});
