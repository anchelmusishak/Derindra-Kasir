<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<title>Kasir Bilyar</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#14201a;--mu:#5b6b62;--pr:#14532d;--ac:#c2410c;--bd:#d5ddd8;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#17211b;--tx:#e8efe9;--mu:#93a398;--pr:#22c55e;--ac:#fb923c;--bd:#2a382f;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:20px}
header{position:sticky;top:0;background:#14532d;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:17px;margin:0}header button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:7px 10px;margin-left:6px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
@media(min-width:700px){#grid{grid-template-columns:repeat(3,1fr)}}
.t{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;min-height:130px;cursor:pointer}
.t.on{border-color:var(--ok)}.t.r1{background:#dc2626;border-color:#7f1d1d;color:#fff}.t.r2{background:#7f1d1d;border-color:#dc2626;color:#fff}.t.r1 .st,.t.r1 .rp,.t.r2 .st,.t.r2 .rp{color:#fff}#al{position:fixed;left:0;right:0;bottom:0;z-index:20}.al{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;font-weight:600;color:#fff;background:#b45309;border-top:1px solid #fff4}.al.end{background:#b91c1c}.al button{background:#fff;color:#111;border:0}
.t b{font-size:16px}.t .st{font-size:12px;color:var(--mu);margin:4px 0}.t .tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.t .rp{color:var(--pr);font-weight:600;margin-top:4px}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.ov.show{display:flex}.sh{background:var(--card);width:100%;max-width:560px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;border-radius:18px;box-shadow:0 14px 44px #000a;padding:16px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px}
button.p{background:var(--pr);color:#fff;border:0}button.d{color:var(--ac);border-color:var(--ac)}
@media(prefers-color-scheme:dark){button.p{color:#06210f}}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>*{flex:1}.row>.n{flex:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{flex:0 0 auto;font-size:13px}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .g{font-size:20px;font-weight:700;border-top:2px solid var(--tx);margin-top:6px;padding-top:8px}
.sm{font-size:12px;color:var(--mu)}.bx{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0}.bx label.n{display:flex;gap:4px;align-items:center;white-space:nowrap}label{font-size:12px;color:var(--mu)}
@media(orientation:landscape){#grid{grid-template-columns:repeat(3,1fr)}.sh{max-width:720px}}
@media(max-height:500px){header{padding:6px 12px}#grid{gap:8px;padding:8px}.t{min-height:0;padding:8px}.t .tm{font-size:22px}.sh{padding:12px}}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#al{top:0;bottom:auto;padding:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}.al{pointer-events:auto;border-radius:12px;border:0;box-shadow:0 6px 20px #0006}
</style></head><body>
<header><h1>🎱 Kasir Bilyar <small style="opacity:.65;font-size:11px">v5</small></h1><div><button onclick="openRep()">Laporan</button><button onclick="openSet()">Pengaturan</button></div></header>
<div id="grid"></div>
<div id="al"></div>
<div class="ov" id="ov" onclick="if(event.target==this)closeM()"><div class="sh" id="sh"></div></div>
<script>
const K='kasirBilyarV1';
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const def=()=>({tables:[1,2,3,4,5,6].map(i=>({id:i,name:'Meja '+i,on:false,start:0,hrs:0,cust:'',orders:[]})),
 menu:[['Air Mineral',5000],['Es Teh',8000],['Kopi',12000],['Kopi Susu',15000],['Mie Instan',15000],['Nasi Goreng',25000],['Kentang Goreng',18000],['Rokok',0]].map(x=>({n:x[0],p:x[1]})),
 cfg:{rate:40000,taxS:10,taxF:10,pph:0.5},hist:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))||def()}catch(e){S=def()}
S.cfg.promos=S.cfg.promos||[];S.cfg.disc=S.cfg.disc||[];
S.cfg=Object.assign({remOn:true,remMin:10,endOn:true,sndOn:true,vibOn:true,vol:80,wake:true,fixOn:true,promoOn:true,taxSOn:true,taxFOn:true,pphOn:true},S.cfg);
S.tables.forEach(t=>{if(t.hrs===undefined){t.hrs=Math.max(0,Math.ceil((t.mins||0)/60));delete t.mins}});
if(!S.cfg.ver){S.cfg.promos.forEach(p=>{p.min=Math.ceil((+p.min||0)/60)});S.cfg.ver=2}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Gagal menyimpan data')}};
const $=id=>document.getElementById(id);let cur=null;
const fnb=t=>t.orders.reduce((a,o)=>a+o.p*o.q,0);
const dstr=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toM=v=>{if(!v)return null;const a=v.split(':').map(Number);return a[0]*60+a[1]};
const inWin=(p,m)=>{const a=toM(p.dari),b=toM(p.sampai);if(a==null||b==null)return true;return a<=b?(m>=a&&m<b):(m>=a||m<b)};
function blockRate(t,i,H){const c=S.cfg;if(t.noPromo)return{rate:+c.rate,n:''};
 const d=new Date(t.start+i*3600000),m=d.getHours()*60+d.getMinutes();let best=c.fixOn?{rate:+c.rate,n:''}:null;
 if(c.promoOn)for(const p of c.promos)if(p.on&&H>=(+p.min||0)&&inWin(p,m)&&(!best||+p.tarif<best.rate))best={rate:+p.tarif,n:p.n};return best}
function sewaCalc(t,H){H=H||t.hrs;const g=[];let s=0,miss=0;
 for(let i=0;i<H;i++){const b=blockRate(t,i,H);if(!b){miss++;continue}s+=b.rate;const k=b.rate+'|'+b.n;const x=g.find(y=>y.k==k);x?x.h++:g.push({k,h:1,rate:b.rate,n:b.n})}
 return{s,g,miss}}
function discOf(t){let b={pct:0,n:'',scope:'all'};if(t.noPromo)return b;const d=dstr(t.start);
 for(const x of S.cfg.disc){if(!x.on||!x.from||!x.to||d<x.from||d>x.to)continue;const q=+x.pct||0;if(q>b.pct)b={pct:q,n:x.n,scope:x.scope||'all'}}return b}
const calc=t=>{const w=sewaCalc(t),d=discOf(t),s=w.s,f=fnb(t),tS=S.cfg.taxSOn?+S.cfg.taxS:0,tF=S.cfg.taxFOn?+S.cfg.taxF:0,
 ds=d.scope=='fnb'?0:Math.round(s*d.pct/100),df=d.scope=='sewa'?0:Math.round(f*d.pct/100),
 ts=Math.round((s-ds)*tS/100),tf=Math.round((f-df)*tF/100);
 return{s,f,ds,df,ts,tf,lines:w.g,miss:w.miss,dn:d.n,dp:d.pct,sub:s+f-ds-df,tax:ts+tf,tot:s+f-ds-df+ts+tf}};
const fmt=ms=>{const neg=ms<0;ms=Math.abs(ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(neg?'-':'')+[h,m,c].map(x=>String(x).padStart(2,'0')).join(':')};
const rem=t=>t.start+t.hrs*3600000-Date.now();
const hm=ts=>new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
let built=false,AL=[],AC=null,lastBeep=0,lastWake=0,WL=null;
function build(){$('grid').innerHTML=S.tables.map(t=>`<div class="t" id="c${t.id}" onclick="openT(${t.id})"><b></b><div class="st"></div><div class="tm"></div><div class="rp"></div></div>`).join('');built=true;render()}
function render(){if(!built)return build();const ph=Math.floor(Date.now()/1000)%2;
 S.tables.forEach(t=>{const e=$('c'+t.id);if(!e)return;const r=t.on?rem(t):0,red=t.on&&r<=60000,ov=t.on&&r<=0;
  e.className='t'+(t.on?' on':'')+(red?(ph?' r1':' r2'):'');
  e.children[0].textContent=t.name;
  e.children[1].textContent=t.on?(ov?'WAKTU HABIS':red?'HAMPIR HABIS':'Main · mulai '+hm(t.start)):'Kosong';
  e.children[2].textContent=t.on?fmt(r):'—';
  e.children[3].textContent=t.on?rp(calc(t).tot):''})}
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function beep(force){const c=S.cfg;
 if((force||c.sndOn)&&AC&&AC.state=='running'){const v=(c.vol||80)/100;for(let i=0;i<3;i++){const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+i*.35;o.type='square';o.frequency.value=i==2?1100:880;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.002,v*.6),t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.28);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.3)}}
 if((force||c.vibOn)&&navigator.vibrate)try{navigator.vibrate([300,120,300,120,300])}catch(e){}}
function notif(txt){try{if(window.Notification&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification('Kasir Bilyar',{body:txt,tag:'kb-'+txt,renotify:true,vibrate:[300,120,300]}))}catch(e){}}
function raise(t,type,r){AL=AL.filter(a=>!(a.id==t.id&&(a.type==type||type=='end')));
 AL.push({id:t.id,type,name:t.name,msg:type=='end'?'WAKTU HABIS':'sisa '+Math.max(1,Math.round(r/60000))+' menit',until:Date.now()+60000,snd:true});
 renderAL();beep();lastBeep=Date.now();notif(t.name+': '+AL[AL.length-1].msg)}
function renderAL(){$('al').innerHTML=AL.map((a,i)=>`<div class="al ${a.type}"><span>${a.type=='end'?'⛔':'⏰'} ${esc(a.name)}: ${a.msg}</span><button onclick="dis(${i})">Matikan</button></div>`).join('')}
function dis(i){AL.splice(i,1);renderAL()}
async function wake(){try{if(!S.cfg.wake||WL||!('wakeLock' in navigator)||document.hidden||!S.tables.some(t=>t.on))return;WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}catch(e){WL=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
function tick(){const now=Date.now(),th=S.cfg.remMin*60000;let ch=false;
 S.tables.forEach(t=>{if(!t.on)return;const r=rem(t);
  if(r>th&&t.f10){t.f10=false;ch=true}
  if(r>0&&t.f0){t.f0=false;ch=true}
  if(S.cfg.remOn&&!t.f10&&r<=th&&r>0&&t.hrs*60>S.cfg.remMin){t.f10=true;ch=true;raise(t,'rem',r)}
  if(!t.f0&&r<=0){t.f0=true;ch=true;if(S.cfg.endOn)raise(t,'end',r)}});
 const n=AL.length;AL=AL.filter(a=>{const t=S.tables.find(x=>x.id==a.id);return t&&t.on&&(a.type=='rem'?t.f10:t.f0)});if(AL.length!=n)renderAL();
 AL.forEach(a=>{if(a.snd&&now>a.until)a.snd=false});
 if(AL.some(a=>a.snd)&&now-lastBeep>=2500){beep();lastBeep=now}
 if(ch)save();render();
 const e=$('rem');if(e&&cur){const t=T();if(t&&t.on){const r=rem(t);e.textContent=fmt(r);e.style.color=r<=60000?'#dc2626':''}}
 if(now-lastWake>10000){lastWake=now;wake()}}
setInterval(tick,500);
const T=()=>S.tables.find(x=>x.id==cur);
function closeM(){$('ov').classList.remove('show');cur=null;render()}
function show(h){$('sh').innerHTML=h;$('ov').classList.add('show')}
function openT(id){cur=id;drawT()}
function drawT(){const t=T();
 if(!t.on){const n=new Date(),v=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 show(`<h2>${t.name} — Mulai Main</h2>
 <label>Nama pelanggan (opsional)</label><input id="cu" placeholder="mis. Budi">
 <div class="row"><div><label>Jam mulai</label><input id="jm" type="time" value="${v}" oninput="prevS()"></div>
 <div><label>Durasi sewa (jam)</label><input id="du" type="number" value="1" min="1" max="24" step="1" oninput="prevS()"></div></div>
 <div class="sm" id="pv"></div>
 <div class="row"><button onclick="closeM()">Batal</button><button class="p" onclick="startT()">Mulai</button></div>`);prevS();return}
 const c=calc(t);
 show(`<h2>${t.name}${t.cust?' · '+t.cust:''}</h2>
 <div class="sm">Mulai ${hm(t.start)} · durasi ${t.hrs} jam · selesai ${hm(t.start+t.hrs*3600000)}</div>
 <div class="tm" id="rem" style="font-size:34px;font-weight:700">${fmt(rem(t))}</div>
 <h3>Tambah waktu sewa</h3><div class="chips"><button onclick="addH(1)">+1 jam</button><button onclick="addH(2)">+2 jam</button><button onclick="addH(3)">+3 jam</button><button onclick="addH(prompt('Berapa jam?'))">Lainnya…</button></div>
 <h3>Tambah pesanan</h3><div class="chips">${S.menu.map((m,i)=>`<button onclick="addO(${i})">${m.n} · ${rp(m.p)}</button>`).join('')}<button onclick="addC()">+ Item lain</button></div>
 <h3>Pesanan</h3>${t.orders.length?t.orders.map((o,i)=>`<div class="it"><span>${o.n}<br><span class="sm">${rp(o.p)} × ${o.q}</span></span><span><button onclick="qty(${i},-1)">−</button> ${o.q} <button onclick="qty(${i},1)">+</button> <b>${rp(o.p*o.q)}</b></span></div>`).join(''):'<div class="sm">Belum ada pesanan</div>'}
 <h3>Total tagihan</h3>${(S.cfg.promos.length||S.cfg.disc.length)?`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${t.noPromo?'':'checked'} onchange="T().noPromo=!this.checked;save();drawT()"> Terapkan promo & diskon otomatis</label>`:''}<div class="sum">
 ${c.lines.map(x=>`<div><span>Sewa ${x.h} jam × ${rp(x.rate)}${x.n?' <span class="sm">· promo '+esc(x.n)+'</span>':''}</span><span>${rp(x.h*x.rate)}</span></div>`).join('')}${c.lines.length>1?`<div><span>Total sewa meja</span><span>${rp(c.s)}</span></div>`:''}${c.miss?`<div style="color:#dc2626"><span>⚠ ${c.miss} jam tanpa tarif berlaku</span><span></span></div>`:''}
 <div><span>Makanan/minuman</span><span>${rp(c.f)}</span></div>
 ${c.ds+c.df?`<div><span>Diskon ${c.dn} (${c.dp}%)</span><span>−${rp(c.ds+c.df)}</span></div>`:''}
 <div><span>Subtotal${c.ds+c.df?' (setelah diskon)':''}</span><span>${rp(c.sub)}</span></div>
 ${S.cfg.taxSOn?`<div><span>Pajak sewa ${S.cfg.taxS}% (PBJT hiburan)</span><span>${rp(c.ts)}</span></div>`:''}
 ${S.cfg.taxFOn?`<div><span>Pajak F&B ${S.cfg.taxF}% (PBJT makan-minum)</span><span>${rp(c.tf)}</span></div>`:''}
 <div class="g"><span>TOTAL</span><span>${rp(c.tot)}</span></div></div>
 <div class="row"><div><label>Uang diterima</label><input id="by" type="number" inputmode="numeric" oninput="kb()"></div><div><label>Kembalian</label><input id="kmb" readonly value="—"></div></div>
 <div class="row"><button class="d" onclick="cancelT()">Batalkan</button><button onclick="closeM()">Tutup</button><button class="p" onclick="pay()">Bayar & Selesai</button></div>`)}
function startT(){const t=T(),[h,m]=$('jm').value.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);
 const du=parseInt($('du').value);if(!(du>0&&du<=24))return alert('Durasi harus 1–24 jam');
 if(sewaCalc({start:d.getTime(),hrs:du},du).miss)return alert('Tidak ada tarif yang berlaku untuk jam & durasi ini. Aktifkan tarif sewa tetap di Pengaturan atau atur promo.');
 Object.assign(t,{on:true,noPromo:false,start:d.getTime(),hrs:du,cust:$('cu').value.trim(),orders:[]});save();drawT()}
function addH(h){h=parseInt(h);if(!(h>0))return;const t=T(),old=t.hrs;t.hrs+=h;if(sewaCalc(t).miss){t.hrs=old;return alert('Tidak ada tarif yang berlaku untuk durasi ini. Aktifkan tarif sewa tetap di Pengaturan atau atur promo.')}save();drawT()}
function prevS(){const e=$('pv');if(!e)return;const q=($('jm').value||'00:00').split(':').map(Number),d=new Date();d.setHours(q[0],q[1],0,0);const H=parseInt($('du').value);
 if(!(H>0)){e.textContent='';return}const w=sewaCalc({start:d.getTime(),hrs:H},H);
 e.innerHTML=w.miss?`<b style="color:#dc2626">Tidak ada tarif yang berlaku untuk ${w.miss} jam. Aktifkan tarif tetap atau atur promo.</b>`:'Sewa: '+w.g.map(x=>`${x.h} jam × ${rp(x.rate)}${x.n?' (promo '+esc(x.n)+')':''}`).join(' + ')+' = <b>'+rp(w.s)+'</b>'}
function addO(i){const t=T(),m=S.menu[i];let o=t.orders.find(x=>x.n==m.n&&x.p==m.p);o?o.q++:t.orders.push({n:m.n,p:m.p,q:1});save();drawT()}
function addC(){const n=prompt('Nama item?');if(!n)return;const p=parseInt(prompt('Harga (Rp)?'));if(!(p>=0))return;T().orders.push({n,p,q:1});save();drawT()}
function qty(i,d){const t=T();t.orders[i].q+=d;if(t.orders[i].q<=0)t.orders.splice(i,1);save();drawT()}
function kb(){const c=calc(T()).tot,v=parseFloat($('by').value)||0;$('kmb').value=v?(v>=c?rp(v-c):'Kurang '+rp(c-v)):'—'}
function pay(){const t=T(),c=calc(t),v=parseFloat($('by').value)||0;
 if(v&&v<c-0.5)return alert('Uang diterima kurang');
 if(!confirm('Selesaikan pembayaran '+rp(c.tot)+'?'))return;
 S.hist.push({ts:Date.now(),meja:t.name,cust:t.cust,start:t.start,hrs:t.hrs,orders:t.orders,...c,bayar:v||c.tot});
 Object.assign(t,{on:false,start:0,hrs:0,cust:'',orders:[]});save();closeM()}
function cancelT(){if(!confirm('Batalkan sesi meja ini tanpa pembayaran?'))return;Object.assign(T(),{on:false,start:0,hrs:0,cust:'',orders:[]});save();closeM()}
const ck=(id,v,l)=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;color:var(--tx)"><input type="checkbox" id="${id}" style="width:auto" ${v?'checked':''}> ${l}</label>`;
function openSet(){const c=S.cfg;cur=null;show(`<h2>Pengaturan</h2>
 <h3>Tarif sewa</h3>${ck('f1',c.fixOn,'Aktifkan tarif sewa tetap (matikan bila hanya memakai harga promo)')}
 <div class="row"><div><label>Tarif sewa tetap per jam (Rp)</label><input id="s1" type="number" value="${c.rate}"></div></div>
 <div class="sm">Sewa dihitung per jam penuh, tidak proporsional menit. Bila tarif tetap dimatikan, hanya harga promo yang berlaku, dan sesi tidak bisa dimulai pada jam yang tidak tercakup promo.</div>
 <h3>Pajak</h3>${ck('t1',c.taxSOn,'Kenakan pajak pada sewa meja')}<div class="row"><div><label>Pajak sewa meja (%)</label><input id="s2" type="number" step="0.1" value="${c.taxS}"></div></div>
 ${ck('t2',c.taxFOn,'Kenakan pajak pada makan-minum')}<div class="row"><div><label>Pajak makan-minum (%)</label><input id="s3" type="number" step="0.1" value="${c.taxF}"></div></div>
 <div class="sm">Pajak yang dipungut dari pelanggan = PBJT (pajak daerah), tarif ditetapkan Perda setempat, maksimal 10% menurut UU HKPD. Cocokkan dengan Perda daerah Anda.</div>
 ${ck('t3',c.pphOn,'Tampilkan estimasi PPh Final di laporan')}<div class="row"><div><label>PPh Final UMKM (% dari omzet, hanya estimasi laporan)</label><input id="s4" type="number" step="0.1" value="${c.pph}"></div></div>
 ${remHTML()}${promoHTML()}${discHTML()}<h3>Menu</h3><div id="ml">${S.menu.map((m,i)=>`<div class="row"><input value="${m.n}" onchange="S.menu[${i}].n=this.value"><input type="number" value="${m.p}" onchange="S.menu[${i}].p=+this.value"><button class="n d" onclick="sync();S.menu.splice(${i},1);openSet()">✕</button></div>`).join('')}</div>
 <button onclick="sync();S.menu.push({n:'Item baru',p:0});openSet()">+ Tambah menu</button>
 <h3>Nama meja</h3>${S.tables.map((t,i)=>`<div class="row"><input value="${t.name}" onchange="S.tables[${i}].name=this.value"></div>`).join('')}
 <div class="row"><button class="d" onclick="if(confirm('Hapus SEMUA riwayat transaksi?')){sync();S.hist=[];save();openSet()}">Hapus riwayat</button><button class="p" onclick="saveSet()">Simpan</button></div>`)}
function sync(){if(!$('s1'))return;const c=S.cfg;c.rate=+$('s1').value||0;c.taxS=+$('s2').value||0;c.taxF=+$('s3').value||0;c.pph=+$('s4').value||0;c.fixOn=$('f1').checked;c.promoOn=$('f2').checked;c.taxSOn=$('t1').checked;c.taxFOn=$('t2').checked;c.pphOn=$('t3').checked;if($('r1')){c.remOn=$('r1').checked;c.remMin=Math.max(1,+$('r2').value||10);c.endOn=$('r3').checked;c.sndOn=$('r4').checked;c.vibOn=$('r5').checked;c.vol=+$('r6').value||80;c.wake=$('r7').checked}}
function saveSet(){sync();save();closeM()}
function remHTML(){const c=S.cfg,ck=(id,v,l)=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="${id}" style="width:auto" ${v?'checked':''}> ${l}</label>`;
 return`<h3>Pengingat & alarm waktu sewa</h3>${ck('r1',c.remOn,'Ingatkan sebelum waktu sewa habis')}
 <div class="row"><div><label>Menit sebelum habis</label><input id="r2" type="number" min="1" value="${c.remMin}"></div><div><label>Volume alarm</label><input id="r6" type="range" min="10" max="100" value="${c.vol}"></div></div>
 ${ck('r3',c.endOn,'Alarm saat waktu habis')}${ck('r4',c.sndOn,'Bunyikan suara alarm')}${ck('r5',c.vibOn,'Getarkan perangkat')}${ck('r7',c.wake,'Jaga layar tetap menyala saat ada meja aktif')}
 <div class="row"><button onclick="sync();unlock();beep(true)">Tes alarm</button><button onclick="askN()">Izinkan notifikasi</button></div>
 <div class="sm">Alarm terjamin berbunyi hanya selama aplikasi terbuka dan layar menyala. Ketuk layar sekali setelah membuka aplikasi agar browser mengizinkan suara. Kotak meja berkedip merah saat sisa waktu ≤ 1 menit dan saat habis.</div>`}
function askN(){if(!window.Notification)return alert('Browser ini tidak mendukung notifikasi');Notification.requestPermission().then(p=>alert('Izin notifikasi: '+p))}
const esc=v=>String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function promoHTML(){return`<h3>Promo harga sewa</h3>${ck('f2',S.cfg.promoOn,'Aktifkan harga promo')}<div class="sm">Sewa dihitung per jam penuh. Tiap blok 1 jam memakai tarif menurut jam mulai blok itu: bila jamnya masuk rentang promo dan durasi total ≥ minimal durasi, dipakai tarif promo; jam di luar rentang memakai tarif tetap (jika aktif). Bila beberapa cocok, dipakai tarif terendah. Kosongkan jam = berlaku sepanjang hari.</div>
 ${S.cfg.promos.map((p,i)=>`<div class="bx"><div class="row"><input value="${esc(p.n)}" placeholder="Nama promo" onchange="S.cfg.promos[${i}].n=this.value"><label class="n"><input type="checkbox" style="width:auto" ${p.on?'checked':''} onchange="S.cfg.promos[${i}].on=this.checked"> Aktif</label><button class="n d" onclick="sync();S.cfg.promos.splice(${i},1);openSet()">✕</button></div>
 <div class="row"><div><label>Min. durasi (jam)</label><input type="number" value="${p.min}" onchange="S.cfg.promos[${i}].min=+this.value"></div><div><label>Tarif/jam promo (Rp)</label><input type="number" value="${p.tarif}" onchange="S.cfg.promos[${i}].tarif=+this.value"></div></div>
 <div class="row"><div><label>Jam mulai berlaku</label><input type="time" value="${p.dari||''}" onchange="S.cfg.promos[${i}].dari=this.value"></div><div><label>Sampai jam</label><input type="time" value="${p.sampai||''}" onchange="S.cfg.promos[${i}].sampai=this.value"></div></div></div>`).join('')}
 <button onclick="sync();S.cfg.promos.push({n:'Paket 3 jam',on:true,min:3,tarif:30000,dari:'',sampai:''});openSet()">+ Tambah promo</button>`}
function discHTML(){const sc=['all','sewa','fnb'],lb={all:'Sewa + F&B',sewa:'Sewa saja',fnb:'F&B saja'};
 return`<h3>Diskon hari raya / tanggal tertentu</h3><div class="sm">Diskon (%) berlaku otomatis bila tanggal mulai main ada di rentang tanggal. Dikurangkan sebelum pajak. Jika beberapa cocok, dipakai persen tertinggi (tidak ditumpuk). Tanggal hari raya berubah tiap tahun, jadi isi manual.</div>
 ${S.cfg.disc.map((x,i)=>`<div class="bx"><div class="row"><input value="${esc(x.n)}" placeholder="Nama (mis. Idul Fitri)" onchange="S.cfg.disc[${i}].n=this.value"><label class="n"><input type="checkbox" style="width:auto" ${x.on?'checked':''} onchange="S.cfg.disc[${i}].on=this.checked"> Aktif</label><button class="n d" onclick="sync();S.cfg.disc.splice(${i},1);openSet()">✕</button></div>
 <div class="row"><div><label>Dari tanggal</label><input type="date" value="${x.from||''}" onchange="S.cfg.disc[${i}].from=this.value"></div><div><label>Sampai tanggal</label><input type="date" value="${x.to||''}" onchange="S.cfg.disc[${i}].to=this.value"></div></div>
 <div class="row"><div><label>Diskon (%)</label><input type="number" step="0.1" value="${x.pct}" onchange="S.cfg.disc[${i}].pct=+this.value"></div><div><label>Berlaku untuk</label><select onchange="S.cfg.disc[${i}].scope=this.value">${sc.map(k=>`<option value="${k}" ${x.scope==k?'selected':''}>${lb[k]}</option>`).join('')}</select></div></div></div>`).join('')}
 <button onclick="sync();S.cfg.disc.push({n:'Diskon Hari Raya',on:true,from:'',to:'',pct:10,scope:'all'});openSet()">+ Tambah diskon</button>`}
function openRep(){cur=null;const d0=new Date();d0.setHours(0,0,0,0);const td=S.hist.filter(h=>h.ts>=d0.getTime());
 const sum=a=>a.reduce((x,h)=>({s:x.s+h.s,f:x.f+h.f,d:x.d+(h.ds||0)+(h.df||0),tax:x.tax+h.tax,tot:x.tot+h.tot}),{s:0,f:0,d:0,tax:0,tot:0});
 const m0=new Date(d0.getFullYear(),d0.getMonth(),1).getTime(),bl=S.hist.filter(h=>h.ts>=m0);
 const blk=(j,a)=>{const x=sum(a);return`<h3>${j} (${a.length} transaksi)</h3><div class="sum"><div><span>Sewa meja</span><span>${rp(x.s)}</span></div><div><span>Makanan/minuman</span><span>${rp(x.f)}</span></div><div><span>Diskon</span><span>−${rp(x.d)}</span></div><div><span>Omzet bersih sebelum pajak</span><span>${rp(x.s+x.f-x.d)}</span></div><div><span>PBJT dipungut (setor ke Pemda)</span><span>${rp(x.tax)}</span></div><div class="g"><span>Total diterima</span><span>${rp(x.tot)}</span></div>${S.cfg.pphOn?`<div><span>Estimasi PPh Final ${S.cfg.pph}% × omzet</span><span>${rp((x.s+x.f-x.d)*S.cfg.pph/100)}</span></div>`:''}</div>`};
 show(`<h2>Laporan</h2>${blk('Hari ini',td)}${blk('Bulan ini',bl)}
 <div class="sm">Omzet untuk dasar PPh Final dihitung sebelum PBJT (PBJT bukan penghasilan usaha). Estimasi ini bukan pengganti perhitungan resmi/konsultasi pajak.</div>
 <h3>Transaksi hari ini</h3>${td.slice().reverse().map(h=>`<div class="it"><span>${h.meja} · ${hm(h.ts)}${h.cust?' · '+h.cust:''}</span><b>${rp(h.tot)}</b></div>`).join('')||'<div class="sm">Belum ada</div>'}
 <div class="row"><button onclick="exp()">Ekspor CSV</button><button class="p" onclick="closeM()">Tutup</button></div>`)}
function exp(){const r=[['Waktu','Meja','Pelanggan','Jam','Sewa','FnB','Diskon','PBJT','Total']].concat(S.hist.map(h=>[new Date(h.ts).toLocaleString('id-ID'),h.meja,h.cust,(h.hrs??(h.mins||0)/60),h.s,h.f,(h.ds||0)+(h.df||0),h.tax,h.tot]));
 const b=new Blob([r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='riwayat-kasir.csv';a.click()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
